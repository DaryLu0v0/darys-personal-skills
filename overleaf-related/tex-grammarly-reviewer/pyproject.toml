[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tex-grammarly-reviewer"
version = "0.3.0"
description = "Review scientific LaTeX with venue-agnostic, comment-only feedback."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DaryLu0v0"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tex-review = "tex_reviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
